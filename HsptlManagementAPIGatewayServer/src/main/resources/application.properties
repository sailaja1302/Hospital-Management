spring.application.name=HsptlManagementAPIGatewayServer
server.port=8000

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance-id:${random.value}}

springdoc.swagger-ui.query-config-enabled=true

springdoc.group-configs[0].group=appointment
springdoc.group-configs[0].paths-to-match=/appointment/**

springdoc.group-configs[2].group=patient
springdoc.group-configs[2].paths-to-match=/patient/**

springdoc.group-configs[1].group=bed
springdoc.group-configs[1].paths-to-match=/bed/**

springdoc.group-configs[3].group=staff
springdoc.group-configs[3].paths-to-match=/staff/**, /doctorSchedule/**

spring.cloud.gateway.server.webmvc.routes[0].id=HsptlManagementAppointmentService
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://HSPTLMANAGEMENTAPPOINTMENTSERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/appointment/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[1].id=HsptlManagementBedService
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://HSPTLMANAGEMENTBEDSERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/bed/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[2].id=HsptlManagementPatientService
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://HSPTLMANAGEMENTPATIENTSERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/patient/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[3].id=HsptlManagementStaffService
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://HSPTLMANAGEMENTSTAFFSERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/staff/**,/doctorSchedule/**
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=StripPrefix=1
